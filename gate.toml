# Push-gate pins (bennett/tools/gate_README.md). Siblings resolve only to these commits.
schema = 1
repo = "bennett-driver"
tool_sha = "822aaeffab369114e1a719a7b887a0192b22d386"
timeout_s = 7200

# Paths no check reads; changing only these reuses a PASS receipt (bennett/tools/gate_README.md).
[receipt]
non_product = [".beads/", "worklog/", "CLAUDE.md"]

[env]
CARGO_TARGET_DIR = "{root}/.tmp/gate-target"

[[check]]
name = "cargo test"
argv = ["cargo", "test", "--offline", "-j3", "--", "--nocapture", "--test-threads=4"]

[[check]]
name = "slow arithmetic generators"
tier = "post-merge"  # long tail: main-health runs --tier full after landing
argv = ["cargo", "test", "--offline", "-j3", "--test", "fixtures", "--", "--ignored", "--nocapture", "--test-threads=4"]

[[check]]
name = "structural quality baseline"
argv = ["python3", "scripts/quality.py"]

[[report]]
name = "promised configured classes (bennett-driver-9zg; expected red)"
argv = ["cargo", "test", "--offline", "-j3", "--test", "classes", "--", "--ignored", "--nocapture", "--test-threads=4"]

[[report]]
name = "promised device models (bennett-driver-7y4; expected red)"
argv = ["cargo", "test", "--offline", "-j3", "--test", "device_models", "--", "--ignored", "--nocapture", "--test-threads=4"]

[[report]]
name = "blocked rung-2 evidence (bennett-driver-ppz)"
argv = ["cargo", "test", "--offline", "-j3", "--test", "pipeline", "--", "--ignored", "--nocapture", "--test-threads=4"]

[[report]]
name = "prepared formatted integer printf (bennett-driver-972; expected red)"
argv = ["cargo", "test", "--offline", "-j3", "--test", "native_scalar", "scalar_printf_process_preparation_uses_the_real_static_native_closure", "--", "--ignored", "--nocapture", "--test-threads=4"]

[siblings."bennett-conformance"]
sha = "b077ae2a22e73b2321dcfe2fccede885f47b8d89"
note = "conformance origin/main (ladder rung-2 and rung-3 fixtures)"

[siblings."bennett-runtimes"]
sha = "248e468ca505c684bbf254e52eb8148f1e530c83"
note = "published native-check adapter and matching runtime distribution"

[siblings."bennett-runtimes".files]
"scripts/native-check" = "bb11d8498a8403a415a77910193302b00bb1978d6ee24c0079bab5aa69ab5c2e"

[siblings."bennett-arith"]
sha = "aab308f8305e92d4946d1ea302af1ea196a27bb3"
note = "arith origin/main: dist publication"

# Frozen rung-2 evidence names these library bytes independently of current APIs.
[siblings."bennett-runtimes-rung2"]
repo = "bennett-runtimes"
sha = "6808622d560b2e301c635c205eecde3d932b6df5"
note = "runtime publication bound by the historical driver regression"

[siblings."bennett-arith-rung2"]
repo = "bennett-arith"
sha = "249e6192b95c6dbbb875510c32a677ba113e9af5"
note = "arithmetic publication bound by the historical driver regression"

[siblings."bennett-plugin"]
sha = "157d4bd1fab98afed8579b2367f26d1d742b0173"
note = "plugin origin/main; the commit the frozen rung-2 evidence was built from"

[[siblings."bennett-plugin".build]]
name = "plugin (LLVM 18 and 23)"
argv = ["python3", "scripts/build"]
outputs = ["build/libbennett-plugin-18.so", "build/libbennett-plugin-23.so"]

# The frozen rung-2 producer stays separate from the native adapter publication.
[siblings."bennett-plugin-native-comparison"]
repo = "bennett-plugin"
sha = "5a092cded3ba3351ba8cc2977a7eaf3b40f46526"
note = "locally materialised 5a092cd snapshot supplies dialect 0.2.13 and selected-entry prepare/check/finalise for closed_unit, dialect_profile, preparation and native_materialisation; earlier pushed 0ac6180 advertises 0.2.10 and fails dialect_profile with BD-E-VERSION; producer publication remains pending under bennett-driver-193/0ai"

[[siblings."bennett-plugin-native-comparison".build]]
name = "native comparison adapter (LLVM 18 and 23)"
argv = ["python3", "scripts/build"]
outputs = ["build/libbennett-plugin-18.so", "build/libbennett-plugin-23.so"]
needs = ["bennett-runtimes", "bennett-arith"]

[siblings."bennett-dialect-spec"]
sha = "687284fa28a79c536b3885cabec3adf5de26e031"
note = "accepted classical R profile 0.3-r1: §§1.7, 19.9 and 23; historical 0.2.x publication retained"

[siblings."bennett-isa-spec-review"]
repo = "bennett-isa-spec"
sha = "618b16f805aa26244dd2cfa74938d1394a21ce57"
note = "ISA 0.9 K91 loader negotiation contract and reference interpreter oracle"

[[siblings."bennett-isa-spec-review".build]]
name = "reference interpreter"
cwd = "reference-interpreter"
argv = ["cargo", "build", "--offline", "--release", "-j3"]
outputs = ["reference-interpreter/target/release/bennett-isa-ref"]

# Explicit R-contract producer; historical producers above retain their identities.
[siblings."bennett-plugin-r-contract"]
repo = "bennett-plugin"
sha = "06c82ecce7c346a8fa5abda0da57339a28f718b7"
note = "R producer with receipt-bound globals and c608310 argv-byte import/exit propagation; dialect-0.3-r1;isa-0.9"

[siblings."bennett-arith-r-contract"]
repo = "bennett-arith"
sha = "5e9b4509f3ee3f95ac9f7d22b43359e72cf9fdab"
note = "arithmetic publication required by the R-contract producer build"

[[siblings."bennett-plugin-r-contract".build]]
name = "R-contract plugin (LLVM 18 and 23)"
# Supply the producer's own arithmetic pin without moving historical consumers.
argv = ["python3", "-c", "import os, pathlib, subprocess; layout=pathlib.Path('.tmp/producer-layout'); layout.mkdir(parents=True, exist_ok=True); dep=layout/'bennett-arith'; target=pathlib.Path('../bennett-arith-r-contract').resolve(); dep.symlink_to(target) if not dep.exists() else None; assert dep.resolve()==target; os.environ['BENNETT_GATE_LAYOUT']=str(layout.resolve()); subprocess.run(['python3','scripts/build'], check=True)"]
outputs = ["build/libbennett-plugin-18.so", "build/libbennett-plugin-23.so"]
needs = ["bennett-arith-r-contract"]
